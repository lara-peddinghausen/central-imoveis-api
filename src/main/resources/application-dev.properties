spring.datasource.url=jdbc:sqlserver://localhost:65346;databaseName=central_imoveis;integratedSecurity=true;encrypt=true;trustServerCertificate=true;
spring.datasource.hikari.auto-commit=true

# Driver e Dialeto para o Hibernate se adaptar ao padrão Microsoft
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ddl-auto como update para criar as tabelas e NUNCA mais apagar seus dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

