# ── Banco de Dados PostgreSQL ───────────────────────────────────────
# Altere "nome_do_seu_banco" para o banco que você criou no pgAdmin/Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/central_imoveis?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate para Postgres ──────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Informa o dialeto correto do PostgreSQL para o Hibernate gerar as queries certas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ── CONFIGURAÇÃO DO JWT ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET_KEY}